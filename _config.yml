title: "@sikac.hu"
url: https://sikac.hu
paginate: 1
baseurl: ""
permalink: /:slug

plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag

exclude:
  - LICENSE-CC-BY-NC
  - LICENSE-MIT
  - README.md
  - bin
  - mise.toml

sass:
  sass_dir: _sass
  style: :compressed

jekyll_compose:
  auto_open: true

author:
  name: Prem Sichanugrist

nav:
  - title: archive
    url: /archive
  - title: about
    url: /about
